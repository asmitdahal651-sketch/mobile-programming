
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<body>
    <script type="module" src="main.js"></script>
    <h1>Contact Us</h1>

    <form id="contact-form">

        <label>Name:</label>
        <input type="text" id="contact-name" placeholder="Enter your name" required>

        <br><br>

        <label>Email:</label>
        <input type="email" id="contact-email" placeholder="Enter your email" required>

        <br><br>

        <label>Message:</label>
        <br>
        <textarea id="contact-message" placeholder="Enter your message" rows="5" cols="30" required></textarea>

        <br><br>

        <button type="submit">Send Message</button>

    </form>

    <p id="contact-result"></p>


    <div id="contact-result"></div>

</body>
</html>
