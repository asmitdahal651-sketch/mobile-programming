<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Web Page</title>
</head>
<body>
    <script src="calculate.js">
    
    </script>
    <h1>Calculator</h1>
    <input type="number" id="num1" placeholder="Enter first number"><br><br>
    <input type="number" id="num2" placeholder="Enter second number"><br><br>
    <button onclick="calculate(document.getElementById('num1'), document.getElementById('num2'), 'add')"> Add</button><br><br>
    <button onclick="calculate(document.getElementById('num1'), document.getElementById('num2'), 'subtract')"> Subtract</button><br><br>
    <button onclick="calculate(document.getElementById('num1'), document.getElementById('num2'), 'multiply')"> Multiply</button><br><br>
    <button onclick="calculate(document.getElementById('num1'), document.getElementById('num2'), 'divide')"> Divide</button><br><br>   
    <p id="calc"></p>
</body>
</html>
