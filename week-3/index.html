<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="script.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Asmit Dahal</title>
</head>

<body>
    <div id="main">
        <div id="card">
            <svg class="sprig" viewBox="0 0 120 34" aria-hidden="true">
                <path d="M60,32 L60,6" />
                <path d="M60,20 C50,13 41,13 32,19 C41,24 50,23 60,20 Z" />
                <path d="M60,20 C70,13 79,13 88,19 C79,24 70,23 60,20 Z" />
            </svg>

            <img class="pic" src="image.jpg" alt="Asmit Dahal">

            <div id="info">
                <p class="name">Asmit Dahal</p>
                <p class="location">Hetauda, Makawanpur</p>

                <div id="qrr">
                    <button id="qr">Show QR code</button>
                    <div id="show">
                        <img class="qri" src="qr.png" alt="QR code">
                        <button id="hide">Hide QR code</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
